<!DOCTYPE html><html><head><meta charset="UTF-8"><title>改进进度</title><script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0e17;color:#e2e8f0;font-family:-apple-system,'Microsoft YaHei',sans-serif;padding:30px}h1{text-align:center;margin-bottom:20px;background:linear-gradient(90deg,#3b82f6,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:1200px;margin:0 auto}.col{background:#111827;border:1px solid #1e293b;border-radius:10px;padding:14px}.col h3{font-size:13px;color:#94a3b8;margin-bottom:12px;display:flex;align-items:center;gap:6px}.col h3 .dot{width:8px;height:8px;border-radius:50%}.dot-todo{background:#64748b}.dot-doing{background:#3b82f6;animation:pulse 1.5s infinite}.dot-done{background:#22c55e}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}.card{background:#1a2332;border:1px solid #1e293b;border-radius:8px;padding:12px;margin-bottom:8px;font-size:13px;transition:.3s}.card:hover{border-color:#3b82f6}.card .title{font-weight:600;margin-bottom:6px}.card .desc{color:#94a3b8;font-size:11px;line-height:1.5}.card .bar{height:4px;background:#1e293b;border-radius:2px;margin-top:8px;overflow:hidden}.card .bar .fill{height:100%;border-radius:2px;transition:width .5s}.fill-0{width:0;background:#64748b}.fill-50{width:50%;background:#3b82f6}.fill-100{width:100%;background:#22c55e}.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;margin-left:6px}.b-todo{background:rgba(100,116,139,.2);color:#94a3b8}.b-doing{background:rgba(59,130,246,.2);color:#3b82f6}.b-done{background:rgba(34,197,94,.2);color:#22c55e}.stats{text-align:center;margin-bottom:20px;font-size:14px;color:#94a3b8}.stats span{color:#3b82f6;font-weight:700;font-size:24px}.refresh{text-align:center;margin-top:16px}.refresh button{background:#3b82f6;color:#fff;border:none;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:12px}</style></head><body><div id="app"><h1>🔧 量化系统改进进度</h1><div class="stats">已完成 <span>{{done}}</span> / {{total}} 个任务</div><div class="board"><div class="col"><h3><span class="dot dot-todo"></span> 待办 ({{todoList.length}})</h3><div class="card" v-for="t in todoList"><div class="title">{{t.title}}<span class="badge b-todo">待办</span></div><div class="desc">{{t.desc}}</div><div class="bar"><div class="fill fill-0"></div></div></div></div><div class="col"><h3><span class="dot dot-doing"></span> 进行中 ({{doingList.length}})</h3><div class="card" v-for="t in doingList"><div class="title">{{t.title}}<span class="badge b-doing">执行中</span></div><div class="desc">{{t.desc}}</div><div class="bar"><div class="fill fill-50"></div></div></div></div><div class="col"><h3><span class="dot dot-done"></span> 已完成 ({{doneList.length}})</h3><div class="card" v-for="t in doneList"><div class="title">{{t.title}}<span class="badge b-done">✅</span></div><div class="desc">{{t.desc}}</div><div class="bar"><div class="fill fill-100"></div></div></div></div></div><div class="refresh"><button onclick="location.reload()">🔄 刷新进度</button> <span style="color:#64748b;font-size:11px;margin-left:10px">每30秒自动刷新</span></div></div><script>const{createApp,computed}=Vue;createApp({setup(){const tasks=Vue.ref([{id:1,title:"加测试框架",desc:"pytest+mock数据+策略/回测/风控测试用例",status:"todo"},{id:2,title:"改错误处理",desc:"去掉裸except+加重试机制+logging日志系统",status:"todo"},{id:3,title:"性能优化",desc:"异步扫描+向量化因子计算+缓存",status:"todo"},{id:4,title:"配置管理",desc:"YAML配置文件+环境变量支持",status:"todo"},{id:5,title:"API安全",desc:"JWT认证+输入验证+CORS限制",status:"todo"},{id:6,title:"依赖更新+代码清理",desc:"requirements.txt+去掉重复代码",status:"todo"},{id:7,title:"验收测试",desc:"重启服务器+跑测试+确认全部通过",status:"todo"}]);const todoList=computed(()=>tasks.value.filter(t=>t.status==="todo"));const doingList=computed(()=>tasks.value.filter(t=>t.status==="doing"));const doneList=computed(()=>tasks.value.filter(t=>t.status==="done"));const done=computed(()=>doneList.value.length);const total=computed(()=>tasks.value.length);setInterval(()=>{fetch("/api/progress").then(r=>r.json()).then(d=>{if(d.tasks)d.tasks.forEach((t,i)=>{if(i<tasks.value.length)tasks.value[i].status=t.status})}).catch(()=>{})},30000);return{tasks,todoList,doingList,doneList,done,total}}}).mount("#app")</script></body></html>
